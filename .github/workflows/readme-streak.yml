name: Render README streak

on:
  schedule:
    - cron: "5 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  streak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download streak card
        run: |
          PRIMARY="https://streak-stats.demolab.com/?user=osmankaankars&theme=dark&hide_border=true&background=45,0f172a,1e293b&ring=38bdf8&fire=38bdf8&currStreakNum=e2e8f0&sideNums=e2e8f0&currStreakLabel=94a3b8&sideLabels=94a3b8&dates=94a3b8&stroke=1e293b&border_radius=12"
          FALLBACK="https://github-readme-streak-stats.herokuapp.com/?user=osmankaankars&theme=dark&hide_border=true&background=45,0f172a,1e293b&ring=38bdf8&fire=38bdf8&currStreakNum=e2e8f0&sideNums=e2e8f0&currStreakLabel=94a3b8&sideLabels=94a3b8&dates=94a3b8&stroke=1e293b&border_radius=12"

          if curl -fsSL --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 20 -A "github-actions" "$PRIMARY" -o assets/streak.svg.tmp; then
            mv assets/streak.svg.tmp assets/streak.svg
          elif curl -fsSL --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 20 -A "github-actions" "$FALLBACK" -o assets/streak.svg.tmp; then
            mv assets/streak.svg.tmp assets/streak.svg
          else
            echo "Streak download failed; keeping previous file."
          fi

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/streak.svg
          git commit -m "Update streak card [Skip GitHub Action]" || exit 0
          git push
